<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitación</title>
    <style>
        /* Estilos generales */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #e8e2d9; /* Color de fondo similar a la piedra */
            font-family: 'Georgia', serif;
            color: #5a4e47;
        }

        /* Contenedor del sobre */
        .envelope-container {
            position: relative;
            width: 320px;
            height: 220px;
            cursor: pointer;
            perspective: 1000px; /* Para el efecto 3D */
        }

        /* El sobre (parte trasera y delantera) */
        .envelope {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: #e8d6d3; /* Color rosa polvo */
            border-radius: 4px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            transition: transform 0.8s ease;
            transform-style: preserve-3d;
        }

        /* La solapa (la tapa que se abre) */
        .envelope-flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #d6c1bf; /* Un tono un poco más oscuro para dar efecto de sombra */
            clip-path: polygon(0 0, 50% 40%, 100% 0);
            transform-origin: top;
            transition: transform 0.8s ease;
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Detalles del hilo y el lacre */
        .envelope-details {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            pointer-events: none; /* Para que el clic traspase */
        }

        /* El hilo cruzado */
        .string-h {
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: #f4f1ea;
            transform: translateY(-50%);
        }
        .string-v {
            position: absolute;
            top: 0;
            left: 50%;
            width: 2px;
            height: 100%;
            background-color: #f4f1ea;
            transform: translateX(-50%);
        }

        /* El sello de lacre dorado */
        .wax-seal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            background: radial-gradient(circle at 30% 30%, #d4af37, #aa7c11);
            border-radius: 50%;
            border: 3px solid #8a6508;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #5a4104;
            font-size: 12px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            text-align: center;
            pointer-events: none;
        }

        /* El contenido de la invitación (oculto al inicio) */
        .invitation-content {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            bottom: 20px;
            background-color: #fffbfa;
            padding: 20px;
            border-radius: 4px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.6s ease 0.4s; /* Aparece después de abrirse */
            z-index: 1;
        }

        /* --- ESTADO ABIERTO (Al hacer clic) --- */
        .envelope-container.open .envelope-flap {
            transform: rotateX(180deg); /* La solapa se levanta */
        }

        .envelope-container.open .invitation-content {
            opacity: 1; /* El contenido se hace visible */
        }

        /* Texto de ejemplo dentro de la invitación */
        h1 { font-size: 22px; margin: 0 0 10px 0; color: #b08a7d; letter-spacing: 2px; }
        p { font-size: 14px; line-height: 1.5; color: #7a6b64; margin: 5px 0; }
    </style>
</head>
<body>

    <div class="envelope-container" onclick="toggleEnvelope(this)">
        <!-- El contenido interior (lo que está dentro del sobre) -->
        <div class="invitation-content">
            <h1>Nuestra Boda</h1>
            <p>Nos alegra muchísimo que nos acompañes</p>
            <p><strong>15 de Agosto, 2026</strong></p>
            <p>Jardín El Paraíso, a las 18:00 h.</p>
            <br>
            <p style="font-size: 12px; font-style: italic;">(Haz clic fuera del sobre para cerrarlo)</p>
        </div>

        <!-- El cuerpo del sobre -->
        <div class="envelope">
            <!-- La solapa -->
            <div class="envelope-flap"></div>
            
            <!-- El hilo y el sello -->
            <div class="envelope-details">
                <div class="string-h"></div>
                <div class="string-v"></div>
                <div class="wax-seal">🕊️</div> <!-- Usamos un emoji de paloma para simular el relieve -->
            </div>
        </div>
    </div>

    <script>
        function toggleEnvelope(element) {
            // Alterna la clase 'open' para abrir o cerrar el sobre
            element.classList.toggle('open');
        }
    </script>

</body>
</html>
